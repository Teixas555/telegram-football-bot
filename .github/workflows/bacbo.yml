
name: RB TIPS CASINO AI

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rb-tips-casino-ai
  cancel-in-progress: false

jobs:
  bacbo:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install requests

      - name: Executar RB TIPS CASINO AI
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CASINO_CHAT_ID: ${{ secrets.CASINO_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python bacbo.py

      - name: Guardar historico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bacbo_results.json
          git diff --cached --quiet || git commit -m "Atualizar historico Bac Bo"
          git push
