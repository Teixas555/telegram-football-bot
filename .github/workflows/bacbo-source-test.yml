
name: Testar fonte BETMIND

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-fonte:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: python -m pip install requests

      - name: Testar pagina publica
        run: python bacbo_source_test.py
